<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hyperliquid India x ENS Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Gilda+Display&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
<style>:root{
  --bg:#060606;--bone:#ECE7DF;--fg:#ECE7DF;--mute:#8d887f;--dim:#5d5a54;--line:rgba(236,231,223,.13);--line2:rgba(236,231,223,.26);
  --accent:#97FCE4;--err:#E58E7E;
  --sans:"Instrument Sans","Helvetica Neue",Arial,sans-serif;--serif:"Instrument Serif",Georgia,"Times New Roman",serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px 20px}
.demo{background:#241a05;color:#f2c46f;font:500 12px var(--sans);padding:8px 14px;text-align:center}

/* masthead: three equal columns keep the logos on the true centre line */
.mast{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.mast-l{font:400 13px var(--sans);color:var(--mute);white-space:nowrap}.mast-r{justify-self:end}
.brands{display:flex;align-items:center;gap:14px}.brands .x{color:var(--dim);font-size:13px}
.brands svg.hli,.brands svg.ens{height:22px;width:auto;display:block}
.hli .cls-1{fill:var(--bone)}.hli .cls-2{fill:#78cdce}
.snd{box-sizing:border-box;line-height:1.3;height:32px;display:inline-flex;align-items:center;justify-content:center;font:500 12.5px/1.3 var(--sans);color:var(--mute);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap;transition:border-color .2s,color .2s}
.snd:hover{border-color:var(--line2);color:var(--fg)}.snd[aria-pressed=false]{opacity:.55}
@media(max-width:640px){.mast-l{visibility:hidden;max-width:0;overflow:hidden}.brands svg.hli,.brands svg.ens{height:19px}}

/* marquee */
.mq{overflow:hidden;border-bottom:1px solid var(--line);padding:11px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.mq-track{display:flex;width:max-content;will-change:transform}
.mq-row{display:flex;white-space:nowrap;font:400 19px var(--serif);color:var(--mute)}
.mq-row span{display:inline-flex;align-items:center}.mq-row i{font:300 18px var(--mono);font-style:normal;color:var(--dim);margin:0 26px}

/* hero, all on one centre axis */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:0}
.full{width:100%}
.eyebrow{margin:0 0 22px;display:flex;align-items:center;justify-content:center;gap:16px;width:100%;font:500 13px var(--sans);color:var(--accent);letter-spacing:.02em}
.eyebrow::before,.eyebrow::after{content:"";height:1px;width:64px;background:linear-gradient(90deg,transparent,var(--accent));opacity:.55}.eyebrow::after{transform:scaleX(-1)}
h1{margin:22px 0 0;font:400 clamp(34px,4.6vw,60px)/1 var(--serif);letter-spacing:-.025em;color:var(--bone)}
h1 i{font-style:normal;letter-spacing:-.01em;background:linear-gradient(100deg,var(--bone) 20%,var(--accent) 60%,var(--bone) 85%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:10px 0 0;max-width:60ch;color:var(--mute);font-size:14.5px;text-wrap:balance}

.strip{display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line);width:100%}
.strip .st{display:flex;align-items:baseline;gap:10px}.strip .sep{font:300 16px var(--mono);color:var(--dim);font-style:normal;align-self:center}
.strip .lab{font:500 12.5px var(--sans);color:var(--mute)}.strip .of{font-size:12px;color:var(--mute)}
.strip .pair{font:400 22px/1 var(--mono);letter-spacing:-.04em;color:var(--bone)}.strip .st:first-child .pair{color:var(--accent)}
.strip .cu{display:inline-flex;align-items:baseline;gap:3px}.strip .cu em{font:400 11.5px var(--sans);font-style:normal;color:var(--mute);margin-right:6px}
.pair{display:inline-flex}.dg{display:inline-block;min-width:.62em;text-align:center;animation:tick .32s cubic-bezier(.2,.8,.2,1)}
@keyframes tick{from{opacity:0;transform:translateY(35%)}to{opacity:1;transform:none}}
@media(max-width:560px){.strip{gap:6px 14px;padding:10px 0}.strip .pair{font-size:19px}}

/* the plate: decode callouts sit around the card, left heavier than right */
.bleed{width:min(1380px,calc(100vw - 48px));max-width:none}
.plate{position:relative;display:grid;grid-template-columns:minmax(0,270px) minmax(0,1fr) minmax(0,230px);align-items:stretch;gap:22px;margin-top:6px;width:100%}
.plate-mid{position:relative;padding:16px 0 4px;align-self:center;min-width:0}
.co-wrap{display:flex;min-width:0}.co-wrap>ol{flex:1}
.co-col{list-style:none;margin:0;padding:10px 0 50px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.co{position:relative;transform:translateY(var(--dy,0));cursor:default;padding:2px 0}
.co.l{text-align:right;padding-right:14px}.co.r{text-align:left;padding-left:14px}
.co-h{display:flex;align-items:baseline;gap:9px}.co.l .co-h{justify-content:flex-end}
.co-h b{font:500 11px/1 var(--mono);background:var(--bone);color:#060606;padding:4px 5px;align-self:center}
.co-h .sep{font:300 15px/1 var(--mono);color:var(--dim)}
.co h4{margin:0;font:400 19px/1.1 var(--serif);color:var(--bone)}
.co h3{margin:0;font:400 clamp(34px,3.4vw,48px)/.95 var(--serif);color:var(--bone);letter-spacing:-.02em}
.co-m{margin:5px 0 0;font:400 11.5px var(--mono);color:var(--accent);opacity:.85}
.co-d{margin:3px 0 0;font-size:12px;line-height:1.4;color:var(--mute)}
.co.title .co-m{margin-top:8px}
.co.on h4,.co.on h3{color:#fff}.co.on .co-h b{background:var(--accent)}.co.on .co-d{color:#c9c4bb}
.co::before{content:"";position:absolute;top:9px;width:6px;height:6px;background:var(--dim);transition:background .3s}
.co.l::before{right:0}.co.r::before{left:0}.co.on::before{background:var(--accent);box-shadow:0 0 8px var(--accent)}
@media(max-width:1240px){
  .bleed{width:100%}
  .plate{grid-template-columns:1fr;gap:14px;margin-top:26px}
  .plate-mid{order:0}.co-wrap.l{order:1}.co-wrap.r{order:2}
  .co-col{list-style:none;margin:0;padding:10px 0 50px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
  .co{width:calc(50% - 6px);transform:none;padding:0 0 0 12px;text-align:left!important}
  .co:nth-child(even){margin-top:22px}.co.r:nth-child(even){margin-top:0}.co.r:nth-child(odd){margin-top:22px}
  .co.l,.co.r{padding:0 0 0 12px}.co::before{left:0!important;right:auto!important}
  .co.l .co-h{justify-content:flex-start}
  .co.title{width:100%}.co.title h3{font-size:46px}
  .co h4{font-size:19px}.co-d{font-size:12px}
}
.cm{position:absolute;width:14px;height:14px;opacity:.7}.cm::before,.cm::after{content:"";position:absolute;background:var(--line2)}.cm::before{left:6px;top:0;width:1px;height:14px}.cm::after{top:6px;left:0;height:1px;width:14px}
.cm.tl{left:0;top:0}.cm.tr{right:0;top:0}.cm.bl{left:0;bottom:0}.cm.br{right:0;bottom:0}
.spot{position:absolute;inset:-40px 6% 0;background:radial-gradient(60% 55% at 50% 42%,rgba(236,231,223,.10),rgba(236,231,223,0) 70%);pointer-events:none}
.spot::before{content:"";position:absolute;left:50%;top:-60px;width:80%;height:70%;transform:translateX(-50%);background:conic-gradient(from 180deg at 50% 0,transparent 158deg,rgba(236,231,223,.07) 180deg,transparent 202deg);filter:blur(18px)}
.stage{min-height:0}
.heat{position:absolute;inset:8% 8% 10%;background:radial-gradient(50% 50% at 50% 50%,rgba(151,252,228,.22),rgba(151,252,228,0) 70%);filter:blur(30px);pointer-events:none}
.stage{position:relative;aspect-ratio:16/9;width:100%;touch-action:pan-y;cursor:grab}.stage:active{cursor:grabbing}
@media(max-width:1240px){.stage{aspect-ratio:16/9}}
@media(max-width:560px){.stage{aspect-ratio:4/3}}
.stage canvas{display:block;width:100%;height:100%}
.stage .fallback{position:absolute;inset:0;display:grid;place-items:center;padding:8%}.stage .fallback img{width:100%;max-width:640px;height:auto;border-radius:3%}
.stage .hint{position:absolute;left:0;right:0;bottom:0;text-align:center;pointer-events:none;font:400 12px var(--sans);color:var(--dim)}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(40% 40% at 50% 50%,rgba(151,252,228,.35),rgba(151,252,228,0) 70%)}
.sides{display:flex;gap:10px;justify-content:center;margin-top:8px}
.side{display:flex;align-items:center;gap:10px;padding:5px 16px 5px 5px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--fg);cursor:pointer;font:500 13.5px var(--sans);transition:border-color .25s,background .25s}
.side img{width:42px;height:auto;display:block;border-radius:2px}.side:hover{border-color:var(--line2)}.side[aria-pressed=true]{border-color:var(--line2);background:rgba(236,231,223,.05)}

.etch{display:flex;align-items:center;gap:14px;overflow:hidden;margin-top:6px;font:400 13px var(--sans);color:var(--accent)}
.etch-bar{width:160px;height:1px;background:var(--line);position:relative}.etch-bar i{position:absolute;inset:0;background:var(--accent);transform-origin:left;box-shadow:0 0 10px var(--accent)}

/* application */
.apply{width:min(580px,100%);margin-top:6px;display:grid;justify-items:center;gap:10px}
.field{display:flex;gap:8px;width:100%;padding:6px;border:1px solid var(--line2);border-radius:999px;background:rgba(236,231,223,.025);transition:border-color .25s,box-shadow .25s}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(151,252,228,.08)}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--fg);font:500 17px var(--sans);padding:0 16px;text-align:left}
.field input::placeholder{color:var(--dim)}
@media(max-width:560px){.field{flex-direction:column;border-radius:22px}.field input{padding:12px 14px;text-align:center}}
.btn{font:600 15px var(--sans);padding:14px 26px;border:0;border-radius:999px;background:var(--bone);color:#0a0a0a;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block;text-align:center}
.btn[disabled]{opacity:.5;cursor:default}.btn.accent{background:var(--accent);color:#04110e}.btn.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.status{min-height:1.5em;font-size:13px;color:var(--mute)}.status.err{color:var(--err)}
.getname{margin:0;color:var(--mute);font-size:13.5px}.getname a{text-underline-offset:3px}

/* result: one centred column */
.result{width:min(640px,100%);margin-top:30px;display:grid;justify-items:center;gap:10px;text-align:center;border:1px solid var(--line);border-radius:2px;padding:38px 28px 32px;position:relative;background:linear-gradient(180deg,rgba(236,231,223,.04),rgba(236,231,223,.01))}
.result::before{content:"";position:absolute;top:-1px;left:50%;width:120px;height:1px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.ring{position:relative;width:168px;height:168px;margin-bottom:6px}.ring svg{width:100%;height:100%;overflow:visible}
.ring .track{fill:none;stroke:#1b1b1a;stroke-width:3}.ring .arc{fill:none;stroke:var(--bone);stroke-width:3;stroke-linecap:round;transition:stroke .5s,filter .5s}
.ring .gate{stroke:var(--dim);stroke-width:2}
.ring.ok .arc{stroke:var(--accent);filter:drop-shadow(0 0 7px rgba(151,252,228,.6))}.ring.ok .gate{stroke:var(--accent)}
.ring .num{position:absolute;inset:0;display:grid;place-content:center;justify-items:center}.ring .num b{font:400 64px/1 var(--serif);letter-spacing:-.03em}.ring .num span{font-size:12px;color:var(--mute)}
.verdict{margin:2px 0 0;font:400 clamp(26px,4vw,36px)/1.12 var(--serif);max-width:24ch;text-wrap:balance}.verdict.ok{color:var(--accent)}
.who{margin:0;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:14px;color:var(--mute)}.who .mono{font-family:var(--mono);font-size:13px;color:var(--dim)}
.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}.acts.left{justify-content:flex-start}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-top:16px}
.chips a{font:500 12.5px var(--sans);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:5px 13px;text-decoration:none;transition:border-color .2s}.chips a:hover{border-color:var(--line2)}

.vidbox{width:min(760px,100%);margin-top:20px;display:grid;grid-template-columns:240px 1fr;gap:28px;text-align:left;border:1px solid var(--line);border-radius:2px;padding:22px}
.vidbox:not(:has(video)){grid-template-columns:1fr;text-align:center}
@media(max-width:620px){.vidbox{grid-template-columns:1fr;justify-items:center}}
.vidbox video{width:240px;max-width:100%;aspect-ratio:4/5;background:#000}
.cap-text{margin:0 0 4px;color:#d9d4cb;font-size:15px;line-height:1.5}.small{color:var(--mute);font-size:12.5px;margin:12px 0 0}
.fine{margin:20px 0 0;color:var(--mute);font-size:13px;max-width:58ch;text-wrap:balance}

/* footer: one centred column */
.site-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px 26px;text-align:center;margin-top:24px;padding:18px 0 8px;border-top:1px solid var(--line)}
.foot-brands svg.hli,.foot-brands svg.ens{height:20px}
.soc{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.soc a{display:inline-flex;align-items:center;gap:8px;font:500 12.5px var(--sans);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 13px;transition:border-color .2s,background .2s}.soc a:hover{border-color:var(--line2);background:rgba(236,231,223,.04)}
.soc svg{width:14px;height:14px;fill:currentColor;display:block}
.legal{margin:0;color:var(--dim);font-size:12px;max-width:none;flex-basis:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* 1-bit dither */
canvas.dbar,canvas.dspot,canvas.dblob{image-rendering:pixelated;image-rendering:crisp-edges;pointer-events:none;display:block}
.dbar{width:100%;height:14px;opacity:.6}.dbar.foot-bar{margin-bottom:6px}
.hero{position:relative;isolation:isolate}
.dblob{position:absolute;z-index:-1;top:60px;left:50%;width:min(640px,94vw);aspect-ratio:1;transform:translateX(-50%);opacity:.11;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.dspot{position:absolute;z-index:0;left:0;top:-24px;width:100%;aspect-ratio:2/1;opacity:.55;-webkit-mask-image:radial-gradient(60% 70% at 50% 40%,#000 40%,transparent);mask-image:radial-gradient(60% 70% at 50% 40%,#000 40%,transparent)}
.stage{z-index:1}
canvas.track{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:4}

/* decode the card */
.side.decode{border-style:dashed}.side.decode .dot{width:10px;height:10px;background:var(--accent);display:inline-block;margin:0 0 0 8px;box-shadow:0 0 8px var(--accent)}
.side.decode[aria-pressed=true]{border-style:solid;border-color:var(--accent)}
@media(max-width:700px){
@media(max-width:640px){
  .sides{flex-wrap:wrap;gap:8px}.side{padding:4px 12px 4px 4px;font-size:12.5px;gap:8px}.side img{width:34px}
  .co-d{display:block;font-size:13px;line-height:1.45;max-width:none}.co-m{font-size:11px}
  .co-col{list-style:none;margin:0;padding:10px 0 50px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
}}

@media(max-width:640px){h1{margin-top:16px}.sub{font-size:13.5px}.fine{font-size:12.5px}}
@media(max-width:1240px){.plate{margin-top:10px}.site-foot{margin-top:18px}}

.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.status{min-height:0}.apply{gap:6px}
.dspot{top:8px!important}
.fine{font-size:12px;max-width:72ch}
.getname{font-size:13px}

@media(max-width:1240px){.co-wrap.l .co-col{padding-bottom:0}.co-wrap.r .co-col{padding-top:0}.co.title h3{font-size:38px}}

/* console layout: the card and the checker share one screen, the result and video stay beside the card */
.hero{align-items:center}
.deck{width:min(1400px,calc(100vw - 48px));display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:28px;align-items:start;padding-top:10px}
.deck .plate{grid-template-columns:minmax(0,175px) minmax(0,1fr) minmax(0,165px);gap:14px;margin:0}
.deck .stage{aspect-ratio:4/3}
.console{position:sticky;top:12px;display:flex;flex-direction:column;align-items:stretch;gap:12px;text-align:left;max-height:calc(100vh - 24px);overflow-y:auto;overscroll-behavior:contain;padding:4px 4px 8px 0;scrollbar-width:thin}
.console h1{margin:0;font-size:clamp(30px,2.8vw,40px);line-height:1.02}
.console .sub{margin:0;font-size:13.5px;max-width:none}
.console .full{width:100%}
.console .strip{justify-content:flex-start;border:1px solid var(--line);border-radius:2px;padding:10px 12px;gap:8px 16px}
.console .apply{width:100%;justify-items:stretch;margin:0}
.console .field{flex-direction:column;border-radius:16px;padding:8px}
.console .field input{padding:10px 12px;text-align:left}
.console .btn{width:100%}
.console .status,.console .getname{text-align:left}
.console .result{width:100%;margin:0;padding:18px 16px 16px;gap:6px}
.console .ring{width:112px;height:112px}.console .ring .num b{font-size:40px}
.console .verdict{font-size:23px;max-width:none}
.console .acts{margin-top:8px}.console .acts .btn{width:auto;padding:10px 16px;font-size:14px}
.console .chips{margin-top:8px}
.console .vidbox{width:100%;margin:0;grid-template-columns:118px 1fr;gap:14px;padding:12px}
.console .vidbox video{width:118px}.console .vidbox .small{display:none}.console .vidbox .cap-text{font-size:13px}
.console .fine{margin:0;font-size:11.5px;max-width:none;text-align:left}
.console .etch{margin:0}
@media(max-width:1240px){
  .deck{grid-template-columns:1fr;gap:12px;width:100%}
  .deck .plate{display:contents}
  .deck .plate-mid{order:1;position:sticky;top:0;z-index:20;background:var(--bg);padding-top:6px}
  .console{order:2;position:static;max-height:none;overflow:visible;padding:0}
  .deck .co-wrap.l{order:3}.deck .co-wrap.r{order:4}
  .deck .stage{aspect-ratio:3/2}
  .console .vidbox{grid-template-columns:100px 1fr}.console .vidbox video{width:100px}
}
.console .acts{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:8px}
.console .result{padding:12px 14px;gap:4px}
.console .ring{width:92px;height:92px}.console .ring .num b{font-size:34px}
.console .verdict{font-size:20px}

/* leaderboard */
.lb{width:min(1400px,calc(100vw - 48px));margin:44px 0 0;text-align:left}
.lb-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 20px;border-top:1px solid var(--line);padding-top:22px}
.lb-h h2{margin:0;font:400 34px/1 var(--serif)}.lb-h span{font-size:13px;color:var(--mute)}
.lb-empty{color:var(--mute);padding:24px 0}
.lb-list{list-style:none;margin:14px 0 0;padding:0}
.lb-row{border-bottom:1px solid var(--line)}.lb-row.cut{border-bottom:1px dashed var(--accent)}
.lb-row.you{background:rgba(151,252,228,.05)}
.lb-main{all:unset;box-sizing:border-box;display:grid;grid-template-columns:44px minmax(120px,1.2fr) minmax(80px,2fr) 48px 24px;align-items:center;gap:16px;width:100%;padding:14px 8px;cursor:pointer}
.lb-main:focus-visible{outline:1px solid var(--accent)}
.lb-rank{font:400 13px var(--mono);color:var(--dim)}
.lb-name{font:500 17px var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* flip: intro and form on one face, the score card on the other */

@keyframes facein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
