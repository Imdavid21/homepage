<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hyperliquid India x ENS Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
<style>:root{
  --bg:#060606;--bone:#ECE7DF;--fg:#ECE7DF;--mute:#8d887f;--dim:#5d5a54;--line:rgba(236,231,223,.13);--line2:rgba(236,231,223,.26);
  --accent:#97FCE4;--err:#E58E7E;
  --sans:"Instrument Sans","Helvetica Neue",Arial,sans-serif;--serif:"Instrument Serif",Georgia,"Times New Roman",serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px 40px}
.demo{background:#241a05;color:#f2c46f;font:500 12px var(--sans);padding:8px 14px;text-align:center}

/* masthead: three equal columns keep the logos on the true centre line */
.mast{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:22px 0;border-bottom:1px solid var(--line)}
.mast-l{font:400 13px var(--sans);color:var(--mute)}.mast-r{justify-self:end}
.brands{display:flex;align-items:center;gap:14px}.brands .x{color:var(--dim);font-size:13px}
.brands svg.hli,.brands svg.ens{height:22px;width:auto;display:block}
.hli .cls-1{fill:var(--bone)}.hli .cls-2{fill:#78cdce}.brands svg.ens{color:var(--bone)}
.snd{font:500 12.5px var(--sans);color:var(--mute);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap;transition:border-color .2s,color .2s}
.snd:hover{border-color:var(--line2);color:var(--fg)}.snd[aria-pressed=false]{opacity:.55}
@media(max-width:640px){.mast-l{visibility:hidden}.brands svg.hli,.brands svg.ens{height:19px}}

/* marquee */
.mq{overflow:hidden;border-bottom:1px solid var(--line);padding:11px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.mq-track{display:flex;width:max-content;will-change:transform}
.mq-row{display:flex;white-space:nowrap;font:italic 400 19px var(--serif);color:var(--mute)}
.mq-row span{display:inline-flex;align-items:center}.mq-row i{font-style:normal;font-size:10px;color:var(--accent);margin:0 26px}

/* hero, all on one centre axis */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:56px}
.full{width:100%}
.eyebrow{margin:0 0 22px;display:flex;align-items:center;justify-content:center;gap:16px;width:100%;font:500 13px var(--sans);color:var(--accent);letter-spacing:.02em}
.eyebrow::before,.eyebrow::after{content:"";height:1px;width:64px;background:linear-gradient(90deg,transparent,var(--accent));opacity:.55}.eyebrow::after{transform:scaleX(-1)}
h1{margin:0;font:400 clamp(52px,9.4vw,128px)/.94 var(--serif);letter-spacing:-.025em;color:var(--bone)}
h1 i{font-style:italic;letter-spacing:-.01em;background:linear-gradient(100deg,var(--bone) 20%,var(--accent) 60%,var(--bone) 85%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:28px 0 34px;max-width:46ch;color:var(--mute);font-size:16px;text-wrap:balance}

.meters{display:grid;grid-template-columns:1fr 1fr;width:min(640px,100%);margin:0 auto;border:1px solid var(--line);border-radius:2px}
.meter{display:grid;justify-items:center;align-content:center;gap:8px;padding:18px 12px;min-height:112px}
.meter+.meter{border-left:1px solid var(--line)}
.lab,.rlab{font:500 12.5px var(--sans);color:var(--mute);margin:0}
.big{display:flex;align-items:baseline;gap:8px}.big .pair{font:400 52px/1 var(--serif);letter-spacing:-.02em;color:var(--accent)}.big .of{font-size:13px;color:var(--mute)}
.bar{width:84px;height:2px;background:#1a1a19;border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.clock{display:flex;gap:16px;justify-content:center}.clock div{display:grid;justify-items:center;gap:2px}.clock .pair{font:400 30px/1 var(--mono);letter-spacing:-.05em}.clock .u{font:400 11.5px var(--sans);color:var(--mute)}
.pair{display:inline-flex}.dg{display:inline-block;position:relative;overflow:hidden;min-width:.62em;text-align:center}
@media(max-width:560px){.meters{grid-template-columns:1fr}.meter+.meter{border-left:0;border-top:1px solid var(--line)}.big .pair{font-size:44px}.clock{gap:12px}.clock .pair{font-size:26px}}

/* the plate: marginalia left and right mirror each other around the card */
.plate{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,860px) minmax(0,1fr);align-items:center;gap:20px;margin-top:34px;width:100%}
.plate-mid{position:relative;padding:16px 0 4px}
.marg{max-width:210px;display:grid;gap:6px;align-content:start;min-height:120px;align-self:center}.marg.l{justify-self:start;text-align:left}.marg.r{justify-self:end;text-align:right}
.marg .k{margin:0;font:400 12.5px var(--sans);color:var(--dim)}.marg .t{margin:0;font:italic 400 34px/1 var(--serif);color:var(--bone)}.marg .d{margin:4px 0 0;font-size:13px;color:var(--mute)}
@media(max-width:1100px){.plate{grid-template-columns:1fr}.marg{display:none}}
.cm{position:absolute;width:14px;height:14px;opacity:.7}.cm::before,.cm::after{content:"";position:absolute;background:var(--line2)}.cm::before{left:6px;top:0;width:1px;height:14px}.cm::after{top:6px;left:0;height:1px;width:14px}
.cm.tl{left:0;top:0}.cm.tr{right:0;top:0}.cm.bl{left:0;bottom:0}.cm.br{right:0;bottom:0}
.spot{position:absolute;inset:-40px 6% 0;background:radial-gradient(60% 55% at 50% 42%,rgba(236,231,223,.10),rgba(236,231,223,0) 70%);pointer-events:none}
.spot::before{content:"";position:absolute;left:50%;top:-60px;width:80%;height:70%;transform:translateX(-50%);background:conic-gradient(from 180deg at 50% 0,transparent 158deg,rgba(236,231,223,.07) 180deg,transparent 202deg);filter:blur(18px)}
.heat{position:absolute;inset:8% 8% 10%;background:radial-gradient(50% 50% at 50% 50%,rgba(151,252,228,.22),rgba(151,252,228,0) 70%);filter:blur(30px);pointer-events:none}
.stage{position:relative;aspect-ratio:16/8;width:100%;touch-action:pan-y;cursor:grab}.stage:active{cursor:grabbing}
@media(max-width:700px){.stage{aspect-ratio:4/3}}
.stage canvas{display:block;width:100%;height:100%}
.stage .fallback{position:absolute;inset:0;display:grid;place-items:center;padding:8%}.stage .fallback img{width:100%;max-width:640px;height:auto;border-radius:3%}
.stage .hint{position:absolute;left:0;right:0;bottom:0;text-align:center;pointer-events:none;font:400 12px var(--sans);color:var(--dim)}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(40% 40% at 50% 50%,rgba(151,252,228,.35),rgba(151,252,228,0) 70%)}
.sides{display:flex;gap:10px;justify-content:center;margin-top:8px}
.side{display:flex;align-items:center;gap:10px;padding:5px 16px 5px 5px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--fg);cursor:pointer;font:500 13.5px var(--sans);transition:border-color .25s,background .25s}
.side img{width:42px;height:auto;display:block;border-radius:2px}.side:hover{border-color:var(--line2)}.side[aria-pressed=true]{border-color:var(--line2);background:rgba(236,231,223,.05)}

.etch{display:flex;align-items:center;gap:14px;overflow:hidden;margin-top:6px;font:400 13px var(--sans);color:var(--accent)}
.etch-bar{width:160px;height:1px;background:var(--line);position:relative}.etch-bar i{position:absolute;inset:0;background:var(--accent);transform-origin:left;box-shadow:0 0 10px var(--accent)}

/* application */
.apply{width:min(580px,100%);margin-top:34px;display:grid;justify-items:center;gap:10px}
.field{display:flex;gap:8px;width:100%;padding:6px;border:1px solid var(--line2);border-radius:999px;background:rgba(236,231,223,.025);transition:border-color .25s,box-shadow .25s}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(151,252,228,.08)}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--fg);font:500 17px var(--sans);padding:0 16px;text-align:left}
.field input::placeholder{color:var(--dim)}
@media(max-width:560px){.field{flex-direction:column;border-radius:22px}.field input{padding:12px 14px;text-align:center}}
.btn{font:600 15px var(--sans);padding:14px 26px;border:0;border-radius:999px;background:var(--bone);color:#0a0a0a;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block;text-align:center}
.btn[disabled]{opacity:.5;cursor:default}.btn.accent{background:var(--accent);color:#04110e}.btn.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.status{min-height:1.5em;font-size:13px;color:var(--mute)}.status.err{color:var(--err)}
.getname{margin:0;color:var(--mute);font-size:13.5px}.getname a{text-underline-offset:3px}

/* result: one centred column */
.result{width:min(640px,100%);margin-top:30px;display:grid;justify-items:center;gap:10px;text-align:center;border:1px solid var(--line);border-radius:2px;padding:38px 28px 32px;position:relative;background:linear-gradient(180deg,rgba(236,231,223,.04),rgba(236,231,223,.01))}
.result::before{content:"";position:absolute;top:-1px;left:50%;width:120px;height:1px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.ring{position:relative;width:168px;height:168px;margin-bottom:6px}.ring svg{width:100%;height:100%;overflow:visible}
.ring .track{fill:none;stroke:#1b1b1a;stroke-width:3}.ring .arc{fill:none;stroke:var(--bone);stroke-width:3;stroke-linecap:round;transition:stroke .5s,filter .5s}
.ring .gate{stroke:var(--dim);stroke-width:2}
.ring.ok .arc{stroke:var(--accent);filter:drop-shadow(0 0 7px rgba(151,252,228,.6))}.ring.ok .gate{stroke:var(--accent)}
.ring .num{position:absolute;inset:0;display:grid;place-content:center;justify-items:center}.ring .num b{font:400 64px/1 var(--serif);letter-spacing:-.03em}.ring .num span{font-size:12px;color:var(--mute)}
.verdict{margin:2px 0 0;font:italic 400 clamp(26px,4vw,36px)/1.12 var(--serif);max-width:24ch;text-wrap:balance}.verdict.ok{color:var(--accent)}
.who{margin:0;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:14px;color:var(--mute)}.who .mono{font-family:var(--mono);font-size:13px;color:var(--dim)}
.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}.acts.left{justify-content:flex-start}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-top:16px}
.chips a{font:500 12.5px var(--sans);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:5px 13px;text-decoration:none;transition:border-color .2s}.chips a:hover{border-color:var(--line2)}

.vidbox{width:min(760px,100%);margin-top:20px;display:grid;grid-template-columns:240px 1fr;gap:28px;text-align:left;border:1px solid var(--line);border-radius:2px;padding:22px}
.vidbox:not(:has(video)){grid-template-columns:1fr;text-align:center}
@media(max-width:620px){.vidbox{grid-template-columns:1fr;justify-items:center}}
.vidbox video{width:240px;max-width:100%;aspect-ratio:4/5;background:#000}
.cap-text{margin:0 0 4px;color:#d9d4cb;font-size:15px;line-height:1.5}.small{color:var(--mute);font-size:12.5px;margin:12px 0 0}
.fine{margin:44px 0 0;color:var(--mute);font-size:13px;max-width:58ch;text-wrap:balance}

/* footer: one centred column */
.site-foot{display:grid;justify-items:center;gap:22px;text-align:center;margin-top:64px;padding:40px 0 20px;border-top:1px solid var(--line)}
.foot-brands svg.hli,.foot-brands svg.ens{height:24px}
.soc{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.soc a{display:inline-flex;align-items:center;gap:9px;font:500 13px var(--sans);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:8px 16px;transition:border-color .2s,background .2s}.soc a:hover{border-color:var(--line2);background:rgba(236,231,223,.04)}
.soc svg{width:14px;height:14px;fill:currentColor;display:block}
.legal{margin:0;color:var(--dim);font-size:12.5px;max-width:56ch}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
<div id="root"></div>
